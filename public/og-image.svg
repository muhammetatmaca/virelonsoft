<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&amp;family=Roboto+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 72px; fill: #E1E0CC; letter-spacing: -0.05em; }
      .role { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 30px; fill: #5FCDFF; }
      .desc { font-family: 'Roboto Mono', monospace; font-size: 20px; fill: #E1E0CC; opacity: 0.8; }
      .badge-text { font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; fill: #0B0A08; }
      .stat-val { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 42px; fill: #5FCDFF; }
      .stat-lbl { font-family: 'Roboto Mono', monospace; font-size: 13px; fill: #E1E0CC; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
    </style>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0081FF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0B0A08" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0A08"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Border Frame -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#E1E0CC" stroke-opacity="0.12" stroke-width="2" rx="24"/>

  <!-- Badges -->
  <g transform="translate(80, 84)">
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#5FCDFF"/>
    <text x="18" y="22" class="badge-text">KURUMSAL YAZILIM</text>

    <rect x="246" y="0" width="220" height="34" rx="17" fill="#E1E0CC"/>
    <text x="264" y="22" class="badge-text">SİSTEM MİMARİSİ</text>
  </g>

  <!-- Brand Title & Tagline -->
  <text x="80" y="195" class="title">VirelonSoft</text>
  <text x="80" y="245" class="role">Yüksek Performanslı Mobil Uygulama &amp; Kurumsal Platformlar</text>

  <!-- Subtitle / Capabilities -->
  <text x="80" y="315" class="desc">React Native · Logo ERP B2B Portalları · Dağıtık Mikroservisler</text>
  <text x="80" y="350" class="desc">Uçtan Uca Mühendislik, Sıfır Gecikme ve Ölçeklenebilir Mimari</text>

  <!-- Metrics / Stats Cards -->
  <g transform="translate(80, 415)">
    <rect x="0" y="0" width="320" height="110" rx="16" fill="#141412" stroke="#E1E0CC" stroke-opacity="0.12" stroke-width="1.5"/>
    <text x="24" y="52" class="stat-val">50+</text>
    <text x="24" y="84" class="stat-lbl">Canlı Mobil Uygulama</text>

    <rect x="350" y="0" width="320" height="110" rx="16" fill="#141412" stroke="#E1E0CC" stroke-opacity="0.12" stroke-width="1.5"/>
    <text x="374" y="52" class="stat-val">B2B ERP</text>
    <text x="374" y="84" class="stat-lbl">Logo Tiger &amp; Go3 Senkron</text>

    <rect x="700" y="0" width="340" height="110" rx="16" fill="#141412" stroke="#E1E0CC" stroke-opacity="0.12" stroke-width="1.5"/>
    <text x="724" y="52" class="stat-val">%100</text>
    <text x="724" y="84" class="stat-lbl">Store &amp; Güvenlik Onayı</text>
  </g>
</svg>
